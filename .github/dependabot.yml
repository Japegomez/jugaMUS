version: 2
updates:
  # npm version updates (target-branch: develop)
  # Security updates are in a separate entry below because target-branch is ignored for security updates
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    assignees:
      - Japegomez
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 3
      semver-minor-days: 5
      semver-patch-days: 2
    exclude-paths:
      - vendor/**
    groups:
      npm-dev-patch-minor:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-prod-patch-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
    ignore:
      # Block all semver-major bumps (Expo SDK, RN, TypeScript, etc.) — use `npx expo upgrade` / manual
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Expo SDK pins these — use `npx expo install` / `npx expo upgrade` on SDK upgrades
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'react-native'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'react-native-*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@react-native-community/*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@react-native-async-storage/*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@sentry/react-native'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'expo*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@expo/*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'

  # npm security updates (no target-branch, so they apply to the default branch where security updates run)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
    assignees:
      - Japegomez
    labels:
      - dependencies
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 3
      semver-minor-days: 5
      semver-patch-days: 2
    exclude-paths:
      - vendor/**
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # Block all semver-major bumps (Expo SDK, RN, TypeScript, etc.) — use `npx expo upgrade` / manual
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Expo SDK pins these — use `npx expo install` / `npx expo upgrade` on SDK upgrades
      - dependency-name: 'react'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'react-dom'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'react-native'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'react-native-*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@react-native-community/*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@react-native-async-storage/*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@sentry/react-native'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: 'expo*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'
      - dependency-name: '@expo/*'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-patch'

  # github-actions version updates (target-branch: develop)
  # Security updates are in a separate entry below because target-branch is ignored for security updates
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    assignees:
      - Japegomez
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 3
      semver-minor-days: 5
      semver-patch-days: 2
    groups:
      github-actions-patch-minor:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  # github-actions security updates (no target-branch, so they apply to the default branch where security updates run)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 1
    assignees:
      - Japegomez
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 3
      semver-minor-days: 5
      semver-patch-days: 2
    groups:
      security-patches:
        applies-to: security-updates
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
